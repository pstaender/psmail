appId: com.psmail.desktop
productName: P.S.Mail
copyright: Copyright © Philipp Staender
# e.g. P.S.Mail-0.0.5-mac-arm64.dmg / P.S.Mail-0.0.5-win-x64.exe — always with the arch, so the
# per-runner builds in .github/workflows/electron-release.yml don't collide on the release.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - src/**/*
  - package.json

# The compiled sidecar (see scripts/build-sidecar.ts) is a native executable, not JS to bundle into
# the app.asar — it has to be a plain file on disk so the main process can spawn it as a child
# process. Only one of psmail-server / psmail-server.exe exists on a given build machine.
extraResources:
  - from: build
    to: .
    filter:
      - psmail-server*

mac:
  category: public.app-category.productivity
  target: dmg
  # No Apple Developer ID, so sign ad-hoc. Without an identity electron-builder skips signing
  # entirely, leaving an unsealed bundle that Apple Silicon refuses to launch once downloaded
  # (quarantined) — it reports the app as damaged instead of showing the usual Gatekeeper prompt.
  # Ad-hoc signing needs the hardened runtime off (or the disable-library-validation entitlement).
  identity: "-"
  hardenedRuntime: false

win:
  target: nsis

linux:
  category: Network
  target: AppImage
