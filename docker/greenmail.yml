services:
  greenmail:
    image: greenmail/standalone:2.1.3
    ports:
      - "3025:3025" # SMTP
      - "3143:3143" # IMAP
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=psmail:psmail-test-pw@example.com
        -Dgreenmail.verbose
